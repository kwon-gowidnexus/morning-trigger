name: diag

# 토큰 권한 진단 (값은 찍지 않고 상태 코드·응답 헤더만). 설정이 끝나면 지운다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe token access (status codes and permission headers only)
        env:
          T: ${{ secrets.MORNING_TRIGGER_TOKEN }}
        run: |
          echo "token length: ${#T}"
          h=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for u in user \
                   repos/kwon-gowidnexus/claude \
                   repos/kwon-gowidnexus/claude/actions/workflows \
                   "repos/kwon-gowidnexus/claude/actions/workflows/daily-fortune.yml/runs?per_page=1" \
                   repos/kwon-gowidnexus/morning-trigger; do
            printf '%s -> ' "$u"
            curl -sS -o /dev/null -w '%{http_code}\n' "${h[@]}" "https://api.github.com/$u"
          done
          echo "--- headers on /user ---"
          curl -sS -o /dev/null -D - "${h[@]}" https://api.github.com/user | grep -i -E "github-authentication-token-expiration|x-oauth-scopes|x-accepted" || true
          echo "--- headers on claude workflows ---"
          curl -sS -o /dev/null -D - "${h[@]}" https://api.github.com/repos/kwon-gowidnexus/claude/actions/workflows | grep -i -E "^HTTP|x-accepted-github-permissions" || true
          echo "--- headers on dispatch (dry: GET on dispatches path is 404 by design; use HEAD of runs) ---"
          curl -sS -o /dev/null -D - "${h[@]}" "https://api.github.com/repos/kwon-gowidnexus/claude/actions/workflows/daily-fortune.yml/runs?per_page=1" | grep -i -E "^HTTP|x-accepted-github-permissions" || true
